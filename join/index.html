<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Join</title>
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="join.css" />
</head>
<body>
  <main class="wrap">
    <h1 id="event-title"></h1>
    <p id="event-subtitle" class="sub"></p>

    <section id="login" class="card">
      <h2>ลงชื่อเข้าใช้งาน</h2>
      <input id="name" maxlength="40" placeholder="ชื่อ / ชื่อเล่น ของคุณ" />
      <button id="btn-login" class="btn-primary">เข้าร่วม</button>
    </section>

    <section id="app" hidden>
      <div class="who">สวัสดี <b id="who-name"></b> · <a href="#" id="btn-logout">เปลี่ยนชื่อ</a></div>
      <div id="tabs" class="tabs"></div>
      <p id="question" class="question"></p>

      <div class="card">
        <textarea id="text" rows="3" placeholder="พิมพ์ความเห็นของคุณ…"></textarea>
        <div class="row"><span id="count" class="count"></span><button id="btn-post" class="btn-primary">โพสต์</button></div>
      </div>

      <h3>ความเห็นทั้งหมด (<span id="n">0</span>)</h3>
      <div id="list"></div>
    </section>
  </main>
  <script type="module" src="join.js"></script>
</body>
</html>
